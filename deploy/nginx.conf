# nginx del contenedor del hub.
#
# Detrás de Cloudflare Tunnel, como nonograma: el TLS lo termina Cloudflare y cloudflared entra por
# http hasta el puerto que el compose de infra mapea al 8080 de acá. Por eso no hay 443 ni redirect
# a https de este mismo host: ese 301 volvería al borde, que volvería a entrar por el túnel, en bucle.

# Cache-Control por ruta vía map y no con add_header en cada location: nginx no hereda add_header
# hacia un nivel que declara el suyo, y un location con su propio add_header perdería la CSP.
#
# Lo de /assets/ lleva el hash del contenido en el nombre (lo pone Vite): no cambia nunca. El resto
# se revalida en cada carga, y eso incluye /catalogo.json, que el deploy de infra reescribe cada
# dos minutos: un proyecto nuevo aparece en la próxima carga (ADR-0004).
map $uri $hub_cache_control {
    default        "no-cache";
    ~^/assets/     "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Las conexiones llegan desde el gateway de la red de Docker, no desde la IP del visitante.
    # cloudflared manda la real en CF-Connecting-IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    # La conexión desde cloudflared es HTTP plano: sin esto, un redirect que arme nginx saldría con
    # http:// absoluto y sacaría al visitante de https.
    absolute_redirect off;

    # ── Cabeceras ───────────────────────────────────────────────────────
    # El build no tiene scripts ni estilos inline (Vite saca todo a /assets/ y React escribe los
    # estilos por el CSSOM, que la CSP no bloquea), así que los scripts del hub entran por 'self'.
    # El nonce no es para el hub: es para el script de detección de bots que Cloudflare inyecta en
    # cada HTML de la zona. Cloudflare lee el nonce de esta cabecera y se lo pone a su script
    # (ADR-0017). $request_id son 16 bytes al azar, distintos en cada pedido. connect-src 'self' es
    # por donde se pide /catalogo.json. media-src deja ver el loop que sirve cada app en su propio
    # host (ADR-0010): los subdominios y el portfolio, que vive en el dominio pelado. Cloudflare Web
    # Analytics está permitido, como en nonograma, por si la zona lo inyecta.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; script-src 'self' 'nonce-$request_id' https://static.cloudflareinsights.com; style-src 'self'; font-src 'self'; img-src 'self'; media-src https://nicolasdalessandro.dev https://*.nicolasdalessandro.dev; connect-src 'self' https://cloudflareinsights.com" always;
    add_header Cache-Control $hub_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # El catálogo no viene en la imagen: lo escribe el deploy de infra en /srv/cache/hub y el
    # compose monta ese directorio acá, read-only. Se monta el directorio y no el archivo porque el
    # deploy lo reemplaza con un rename, y un bind de un archivo suelto se queda con el inodo viejo.
    # Si falta, 404, y el hub dice que no pudo leer la lista.
    location = /catalogo.json {
        root /usr/share/nginx/catalogo;
        try_files /catalogo.json =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. { return 404; }
}
